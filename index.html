:root{--g1:#ffe49a;--g2:#c4902a;--bg:#0b0a08;--card:#161410;--tx:#f4ead2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#2b2110,var(--bg));color:var(--tx);font-family:'BNazanin',Tahoma,sans-serif;font-size:19px}
.wrap{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:1fr 360px;gap:20px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
h1{grid-column:1/-1;text-align:center;margin:8px 0;font-size:34px;background:linear-gradient(var(--g1),var(--g2));-webkit-background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid #4a3a1a;border-radius:16px;padding:16px}
label{display:block;margin:10px 0 4px;color:var(--g1)}
input[type=text],textarea{width:100%;background:#0d0c0a;color:var(--tx);border:1px solid #5a4620;border-radius:10px;padding:8px;font:inherit}
textarea{height:170px;line-height:1.7}
button{font:inherit;font-weight:bold;background:linear-gradient(var(--g1),var(--g2));color:#201808;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;margin:4px 0}
button.s{background:#2a2216;color:var(--g1);border:1px solid #5a4620}
.pick{position:relative;border:1px dashed #5a4620;border-radius:10px;overflow:auto;max-height:430px;margin-top:8px;text-align:center}
.pick canvas{max-width:100%;cursor:crosshair}
small{color:#b9a779;display:block;margin-top:6px;line-height:1.7}
#stage{width:100%;max-width:360px;aspect-ratio:9/16;background:#000;border-radius:12px;border:1px solid #6b5522;display:block;margin:auto}

<script>
/* تشخیص خودکار لوگو و عکس اعضا روی بنر (الگوی ثابت بنرهای انجمن) - ورودی: {data:RGBA, width, height} */
function detectBanner(img){
  const W=img.width,H=img.height,f=Math.max(1,Math.round(W/556)),w=Math.floor(W/f),h=Math.floor(H/f);
  const gold=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=((y*f+(f>>1))*W+(x*f+(f>>1)))*4,r=img.data[i],g=img.data[i+1],b=img.data[i+2];
    if(r>140&&r>=g&&g>b&&r-b>70&&g>85)gold[y*w+x]=1;
  }
  const lab=new Int32Array(w*h),comps=[];let n=0;const st=[];
  for(let s=0;s<w*h;s++){
    if(!gold[s]||lab[s])continue;n++;lab[s]=n;st.push(s);
    let x0=w,x1=0,y0=h,y1=0,cnt=0;
    while(st.length){const p=st.pop(),px=p%w,py=(p/w)|0;cnt++;
      if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=px+dx,ny=py+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;const q=ny*w+nx;if(gold[q]&&!lab[q]){lab[q]=n;st.push(q)}}}
    comps.push({x0,x1,y0,y1,cnt});
  }
  let logo=null;const mem=[];
  for(const c of comps){
    const bw=c.x1-c.x0+1,bh=c.y1-c.y0+1,sz=(bw+bh)/2,asp=Math.abs(bw-bh)/Math.max(bw,bh);
    if(asp>0.12||c.cnt<sz*3)continue;
    const cx=(c.x0+c.x1+1)/2*f,cy=(c.y0+c.y1+1)/2*f,rel=sz/w;
    if(rel>0.2&&rel<0.34&&cy<H*0.3){if(!logo||sz>logo.sz)logo={x:cx,y:cy,r:sz/2*f,sz}}
    else if(rel>0.10&&rel<0.19&&cx>W*0.7)mem.push({x:cx,y:cy,r:sz/2*f});
  }
  mem.sort((a,b)=>a.y-b.y);
  const L=logo;const mm=L?mem.filter(m=>m.y>L.y+L.r*1.1):mem;
  const out=[];for(const m of mm){if(!out.length||m.y-out[out.length-1].y>m.r)out.push(m)}
  return{logo:logo&&{x:logo.x,y:logo.y,r:logo.r},members:out};
}
if(typeof module!=='undefined')module.exports={detectBanner};

</script>

/* ---------- انتخاب نقاط روی بنر ---------- */
function parse(){const L=$('mem').value.split('\n');return L.map(s=>s.trim()).map(l=>{const p=l.split('|').map(x=>x.trim());return{n:p[0]||'',c:p[1]||'',r:p[2]||''}})}
function parseOld(){return $('mem').value.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());return{n:p[0],c:p[1]||'',r:p[2]||''}})}
function drawPick(){
  if(!banner)return;
  pk.width=banner.width;pk.height=banner.height;pc.drawImage(banner,0,0);
  const r=+$('rad').value;
  pts.forEach((p,i)=>{
    pc.lineWidth=Math.max(3,banner.width/200);pc.strokeStyle=i?'#00e0ff':'#ff3a6a';
    pc.beginPath();pc.arc(p.x,p.y,i?r:r*1.8,0,7);pc.stroke();
    pc.fillStyle=pc.strokeStyle;pc.font=Math.round(r*.7)+'px sans-serif';pc.textAlign='center';pc.fillText(i?i:'لوگو',p.x,p.y+r*.25);
  });
  const n=pts.length?Math.max(0,pts.length-1):0;
  if(!pts.length)return;$('info').textContent=pts.length===0?'اول مرکز لوگوی بنر را کلیک کن.':(pts.length<=n?`عکس عضو شماره ${pts.length} را کلیک کن (از ${n} نفر).`:'همه نقاط ثبت شد ✔ پیش‌نمایش را بزن.');
}
const say=m=>$('info').textContent=m;
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{banner=im;pts=[];drawPick();autoRead()};im.src=URL.createObjectURL(f)};
async function autoRead(){
  const c=document.createElement('canvas');c.width=banner.width;c.height=banner.height;const x=c.getContext('2d');x.drawImage(banner,0,0);
  const r=detectBanner(x.getImageData(0,0,c.width,c.height));
  if(!r.logo||!r.members.length){say('تشخیص خودکار نشد؛ دستی کلیک کن (اول لوگو، بعد اعضا).');return}

function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const fixFa=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[|_\[\]{}]/g,'').trim();

  const rows=[];

    const cy=r.members[i].y,n=(await rd(cropBin(c,.551*W,cy-.02*W,.227*W,.092*W,150),'6')).split('\n').map(z=>z.trim()).filter(Boolean),

/* ---------- آماده‌سازی ---------- */
function prepare(){

  const P=parse();M=pts.slice(1).map((_,i)=>P[i]||{n:'',c:'',r:''});
  const r=+$('rad').value*0.93;
  avs=M.map((m,i)=>{const p=pts[i+1],c=document.createElement('canvas');c.width=c.height=400;const x=c.getContext('2d');
    x.beginPath();x.arc(200,200,200,0,7);x.clip();x.drawImage(banner,p.x-r,p.y-r,2*r,2*r,0,0,400,400);return c});
  // چینش بنر

  S.SC0=S.TB+2.8;S.SCD=S.tall?Math.max(4,N*.95):0;

const S={};

function render(t){

  line(t,3.9,5.0,1395,230);
  txt('اعضای کمیته تخصصی',t,5.9,TP4,545,84,900,'w',.9,.5);
  txt(($('title').value||'کمیته تخصصی'),t,6.2,TP4,640,140,920,'g',1.2,.5);

function drawBanner(t){

let ac=null,dest=null,master=null;
function audioInit(forRec){
  ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.9;
  const len=ac.sampleRate*2.2,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const cvb=ac.createConvolver();cvb.buffer=ir;const wet=ac.createGain();wet.gain.value=.35;
  master.connect(cvb);cvb.connect(wet);
  dest=ac.createMediaStreamDestination();
  [master,wet].forEach(n=>{n.connect(dest);if(!forRec)n.connect(ac.destination)});
}
function tone(f,t,d,g,type='sine',h=0){
  const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.05);
  if(h){tone(f*2,t,d*.6,g*h,type)}
}
function noiseBurst(t,d,f0,f1,g){
  const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;
  fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  const v=ac.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+d*.5);v.gain.linearRampToValueAtTime(0,t+d);
  s.connect(fl);fl.connect(v);v.connect(master);s.start(t);
}
function schedule(a0){
  const at=x=>a0+x,N=S.N;
  // پد ملایم  Dm - Bb - F - C
  const ch=[[146.8,174.6,220],[116.5,146.8,174.6],[174.6,220,261.6],[130.8,164.8,196]];
  for(let b=0;b*4<S.END+2;b++)ch[b%4].forEach(f=>{const o=ac.createOscillator(),v=ac.createGain(),lp=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=700;
    v.gain.setValueAtTime(0,at(b*4));v.gain.linearRampToValueAtTime(.035,at(b*4+1.5));v.gain.linearRampToValueAtTime(0,at(b*4+4.2));o.connect(lp);lp.connect(v);v.connect(master);o.start(at(b*4));o.stop(at(b*4+4.3))});
  // پیانوی ساده
  const sc=[293.7,349.2,440,523.3,587.3,698.5,880];
  for(let t=1;t<S.END-1;t+=.5){tone(sc[Math.floor(rnd(t*7)*5)],at(t),1.6,.05,'triangle',.3)}
  noiseBurst(at(.8),1.2,300,3000,.12);noiseBurst(at(4.9),1.5,500,4000,.16);
  tone(58,at(6.4),1.6,.6);
  for(let i=0;i<N;i++){const t=6.9+i;tone(sc[(i*2)%7]*2,at(t),1.4,.16,'sine',.4);tone(sc[(i*2)%7],at(t+.02),1.2,.07,'triangle');noiseBurst(at(t+.7),.4,800,3500,.08)}
  noiseBurst(at(S.TP4),.7,400,4000,.18);
  tone(52,at(S.TB),2,.7);noiseBurst(at(S.TB),1.6,3000,9000,.12);
  for(let i=0;i<14;i++)tone(sc[i%7]*2,at(S.TB+.2+i*.12),1.2,.04,'sine');
  [293.7,440,587.3,880].forEach((f,i)=>tone(f,at(S.END-2.6+i*.1),2.6,.1,'sine',.3));
}

async function run2(record){
  msg('');

  {const q=+$('q').value;cv.width=q;cv.height=Math.round(q*16/9)}
  if(record&&!window.MediaRecorder){msg('این مرورگر ضبط ویدیو را پشتیبانی نمی‌کند؛ با Chrome کامپیوتر باز کن.');return}
  cancelAnimationFrame(raf);if(ac){try{ac.close()}catch(e){}ac=null;dest=null}
  const useSnd=$('snd').checked||record;let rec=null,chunks=[];
  if(useSnd){try{audioInit(record);if(ac.resume)await ac.resume()}catch(e){ac=null;dest=null;msg('صدا فعال نشد؛ بدون صدا ادامه می‌دهم.')}}
  try{await document.fonts.load('40px BNazanin')}catch(e){}
  await new Promise(r=>{if(logo.complete)r();else{logo.onload=r;logo.onerror=r;setTimeout(r,3000)}});
  if(!logoOK)msg('فایل logo.png پیدا نشد (پوشه assets را آپلود کرده‌ای؟)؛ با لوگوی ساده ادامه می‌دهم.');
  if(ac)schedule(ac.currentTime+.15);
  if(record){
    const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    const ms=new MediaStream([...cv.captureStream(30).getVideoTracks(),...(dest?dest.stream.getAudioTracks():[])]);
    try{rec=new MediaRecorder(ms,{mimeType:mt,videoBitsPerSecond:8e6})}catch(e1){try{rec=new MediaRecorder(ms)}catch(e2){msg('ضبط ویدیو در این مرورگر کار نمی‌کند: '+e2.message);return}}rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=()=>{if(!chunks.length){msg('ویدیو خالی ضبط شد؛ با Chrome کامپیوتر امتحان کن.');$('rec').disabled=false;return}const ext=mt.includes('mp4')?'mp4':'webm',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mt}));a.download='Intro_'+($('title').value||'committee').replace(/\s+/g,'_')+'.'+ext;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),4000);$('rec').disabled=false};
    $('rec').disabled=true;rec.onerror=e=>msg('خطای ضبط: '+(e.error&&e.error.message||''));rec.start(1000);msg('در حال ضبط... تا پایان صبر کن و تب را عوض نکن.');
  }
  const st=performance.now()+150;
  const loop=()=>{const t=(performance.now()-st)/1000;render(Math.max(t,0));if(t<S.END)raf=requestAnimationFrame(loop);else{msg(rec?'ضبط تمام شد؛ فایل در حال دانلود است.':'پایان پیش‌نمایش.');if(rec)rec.stop()}};
  loop();
}
$('play').onclick=()=>run(false);$('rec').onclick=()=>run(true);
</script>
